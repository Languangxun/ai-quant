# 股票模拟盘 / 回测参数（trading.stock_account + sim.stock_run + backtest.stock_engine）
stock:

  capital: 20000              # 实盘初始本金（首次建盘生效；改本金用 scripts/reset_account.py）

  # 组合约束
  max_positions: 5            # 最大同时持仓数
  max_position_pct: 20        # 单票上限（占总资产 %）
  min_order_amount: 5000      # 单笔最小买入金额（金额上限）
  min_order_pct: 5            # 小资金自适应：实际下限 = min(min_order_amount, 总资产×该比例%)
  lot_size: 100               # A股一手

  # 日内多时点交易（建议与 crontab 同步；每个时点独立扫描/决策/执行）
  intraday:
    times: ["10:00", "11:00", "13:30", "14:45"]
    max_buys_per_day: 3       # 每日最多买入笔数（含加仓）
    once_per_code_per_day: true   # 同一只票当日不重复加仓
    # 盘中/午休资料刷新：默认走 volatility_watch 事件驱动；
    # 如需回退固定时间表（cron 调 scripts/intraday_research.py），
    # 在此加回 research_times 即可

  # 板块波动监控（事件驱动激活，替代固定时间表）
  # scripts/volatility_watcher.py --loop 常驻；状态存 sim/state/
  volatility_watch:
    enabled: true
    interval_sec: 20          # 板块快照间隔（东财 m:90+t:2 一次全量，20s≈3req/min）
    quiet_minutes: 60         # 静默超过 N 分钟强制激活一次
    min_cooldown_min: 15      # 两次激活最小间隔
    max_activations: 8        # 每日最多激活次数
    # 波动定义：ATR / 布林带宽 / 量能 至少满足 min_signals 个
    atr_ratio: 1.8            # 当日 TR / ATR14
    bw_z: 2.0                 # 布林带宽(20,2) z 分数（近60日分布）
    vol_ratio: 2.0            # 今日量 / MA5 量
    min_signals: 2
    # 快照预筛阈值（用于挑出需要复核的板块）
    amp_pct: 2.2              # 日振幅%
    pct_abs: 1.8              # 涨跌幅绝对值%
    amount_ratio: 2.0         # 快照成交额 vs 自身近60快照均值
    max_verify: 6             # 每周期最多复核几个板块
    verify_ttl_sec: 300       # 同板块复核缓存

  # 决策上下文附带五档挂单 + 集合竞价状态（借鉴 GUI 盘口面板）
  orderbook:
    enabled: true
    max_codes: 6              # 候选前4 + 持仓，去重后最多 N 只
    levels: 3                 # 每侧返回档数（1-5）
    execution_pricing: true   # BUY 用卖一/SELL 用买一成交；无卖单不买、无买单不卖

  # 交易费用（A股）
  fees:
    commission_rate: 0.00025  # 佣金 万2.5
    min_commission: 5.0       # 最低 5 元
    stamp_tax_rate: 0.0005    # 印花税 0.05%（仅卖出）
    transfer_fee_rate: 0.00001  # 过户费 0.001%

  # 成交口径：信号 T 日收盘生成，T+1 成交（close=收盘价，open=开盘价）
  exec_px: close

  # 退出：CLI 同款 ATR 跟踪止损
  stop:
    atr_mult: 1.5
    trail_trigger: 1.02
    trail_ratio: 0.94

  # 事件风险覆盖（特朗普/关税/地缘/美联储等；盘前 event_risk + LLM 修正）
  # 只收紧 BUY，不干预 SELL；normal 或 offensive+elevated 时不动作。
  event_risk:
    enabled: true
    elevated_max_position_pct: 15   # elevated：单票目标仓位上限
    elevated_max_buys: 2            # elevated：单次决策最多新增买入笔数
    high_max_position_pct: 10       # high：单票目标仓位上限
    high_max_buys: 1                # high：单次决策最多新增买入笔数
    block_hurt_sectors: true        # high 时跳过明确受损行业

  # 信号/选股（复用 CLI 多维评分 + RISK_PARAMS）
  risk_mode: 稳健             # 保守 / 稳健 / 激进

  universe:
    min_bars: 400             # 最少K线
    max_scan: 120             # 实盘每日扫描上限（按市值降序；Pi上约2-3分钟）
    min_price: 2.0            # 剔除仙股
    recent_days: 15           # 最新K线需在最近 N 个自然日内（剔除停牌/退市）
    exclude_etf: false        # 兼容旧开关；false 时再看 include_etf
    include_etf: true         # 股票+ETF 同池混选（需 CLI --refresh-etf 回填数据）
    etf_min_price: 0.5        # ETF 单独的低价过滤（不少宽基ETF低于2元）
    etf_max_scan: 30          # ETF 独立扫描配额（避免被大市值股票挤出 max_scan）
    exclude_bj: true
    boards: all               # all=全市场；main=仅沪深主板

  # 市场规则（trading/instruments.MarketModel）
  market:
    etf:
      # T+0 类别：跨境/债券/黄金/货币/商品；不配置则用内置默认
      t0_all: false           # true=所有 ETF 按 T+0（不推荐）
      t0_codes: []            # 显式补充 T+0 代码，如 [sz159941]
      # t0_keywords: [...]    # 覆盖内置关键词
      # t0_prefixes: [sh511, sh513, sh518]
      limit_pct_overrides: {} # 显式涨跌停覆盖，如 {sh510300: 0.10}

  # 回测（日线口径，不含日内多次决策）
  backtest:
    capital: 100000           # 回测默认本金（保持历史口径）
    start: ""                 # 空=全缓存；可填 2023-01-01
    benchmark: ""             # 空=等权全市场；可填 sh000001
